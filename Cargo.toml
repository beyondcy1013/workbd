[package]
name = "workbd"
version = "0.1.0"
edition = "2021"
description = "Native Rust CLI client for WorkBuddy / CodeBuddy AI"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
rustyline = "14.0"
clap = { version = "4", features = ["derive"] }
colored = "2"
dirs = "5"
chrono = "0.4"
base64 = "0.22"
